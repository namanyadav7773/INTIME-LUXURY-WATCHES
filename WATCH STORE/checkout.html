<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
        content="Checkout | VÉLOR Watches">

    <title>Checkout | VÉLOR Watches</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ================= NAVIGATION ================= -->

    <header class="product-header">

        <nav>

            <a href="index.html" class="logo">
                VÉLOR
            </a>


            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="shop.html">
                    Shop
                </a>

                <a href="#">
                    Collections
                </a>

                <a href="#">
                    About
                </a>

                <a href="#">
                    Contact
                </a>

            </div>


            <div class="nav-icons">

                <a href="shop.html">
                    Continue Shopping
                </a>

            </div>

        </nav>

    </header>



    <!-- ================= CHECKOUT ================= -->

    <main class="checkout-page">


        <!-- CHECKOUT HEADING -->

        <div class="checkout-heading">

            <p class="small-heading">
                VÉLOR
            </p>

            <h1>
                CHECKOUT
            </h1>

        </div>



        <div class="checkout-layout">


            <!-- ================= CUSTOMER INFORMATION ================= -->

            <section class="checkout-form">


                <div class="checkout-section">

                    <p class="checkout-label">
                        01 — CONTACT INFORMATION
                    </p>


                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            placeholder="Enter your full name"
                            required>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="email">
                                Email
                            </label>

                            <input
                                type="email"
                                id="email"
                                placeholder="you@example.com"
                                required>

                        </div>


                        <div class="form-group">

                            <label for="phone">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                id="phone"
                                placeholder="+91 XXXXX XXXXX"
                                required>

                        </div>

                    </div>

                </div>



                <!-- ================= SHIPPING ================= -->

                <div class="checkout-section">

                    <p class="checkout-label">
                        02 — SHIPPING ADDRESS
                    </p>


                    <div class="form-group">

                        <label for="address">
                            Address
                        </label>

                        <input
                            type="text"
                            id="address"
                            placeholder="House number, street, area"
                            required>

                    </div>


                    <div class="form-row">

                        <div class="form-group">

                            <label for="city">
                                City
                            </label>

                            <input
                                type="text"
                                id="city"
                                placeholder="City"
                                required>

                        </div>


                        <div class="form-group">

                            <label for="pincode">
                                Pincode
                            </label>

                            <input
                                type="text"
                                id="pincode"
                                placeholder="400001"
                                required>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="state">
                            State
                        </label>

                        <select id="state" required>

                            <option value="">
                                Select State
                            </option>

                            <option>
                                Maharashtra
                            </option>

                            <option>
                                Gujarat
                            </option>

                            <option>
                                Karnataka
                            </option>

                            <option>
                                Delhi
                            </option>

                            <option>
                                Rajasthan
                            </option>

                            <option>
                                Uttar Pradesh
                            </option>

                            <option>
                                West Bengal
                            </option>

                            <option>
                                Tamil Nadu
                            </option>

                            <option>
                                Telangana
                            </option>

                            <option>
                                Kerala
                            </option>

                            <option>
                                Other
                            </option>

                        </select>

                    </div>

                </div>



                <!-- ================= PAYMENT ================= -->

                <div class="checkout-section">

                    <p class="checkout-label">
                        03 — PAYMENT METHOD
                    </p>


                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            value="cod"
                            checked>

                        <span>

                            <strong>
                                Cash on Delivery
                            </strong>

                            <small>
                                Pay when your order arrives.
                            </small>

                        </span>

                    </label>


                    <label class="payment-option">

                        <input
                            type="radio"
                            name="payment"
                            value="online">

                        <span>

                            <strong>
                                Online Payment
                            </strong>

                            <small>
                                UPI / Card / Net Banking
                            </small>

                        </span>

                    </label>

                </div>



                <button
                    class="place-order"
                    onclick="placeOrder()">

                    PLACE ORDER

                </button>


            </section>



            <!-- ================= ORDER SUMMARY ================= -->

            <aside class="checkout-summary">

                <p class="checkout-label">
                    YOUR ORDER
                </p>


                <div id="checkout-products"></div>


                <div class="checkout-summary-line">

                    <span>
                        Subtotal
                    </span>

                    <strong id="checkout-subtotal">
                        ₹0
                    </strong>

                </div>


                <div class="checkout-summary-line">

                    <span>
                        Shipping
                    </span>

                    <strong>
                        FREE
                    </strong>

                </div>


                <div class="checkout-total">

                    <span>
                        TOTAL
                    </span>

                    <strong id="checkout-total">
                        ₹0
                    </strong>

                </div>

            </aside>


        </div>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer>

        <div class="footer-logo">
            VÉLOR
        </div>


        <div class="footer-links">

            <a href="index.html">
                Home
            </a>

            <a href="shop.html">
                Shop
            </a>

            <a href="#">
                Instagram
            </a>

            <a href="#">
                Contact
            </a>

        </div>


        <p>
            © 2026 VÉLOR. All Rights Reserved.
        </p>

    </footer>



    <!-- ================= CHECKOUT JAVASCRIPT ================= -->

    <script>

        let cart =
            JSON.parse(localStorage.getItem("velorCart")) || [];


        const productsContainer =
            document.getElementById("checkout-products");

        const subtotalElement =
            document.getElementById("checkout-subtotal");

        const totalElement =
            document.getElementById("checkout-total");


        let subtotal = 0;


        cart.forEach(function (product) {


            subtotal +=
                product.price * product.quantity;


            productsContainer.innerHTML += `

                <div class="checkout-product">

                    <img
                        src="${product.image}"
                        alt="${product.name}">

                    <div>

                        <h3>
                            ${product.name}
                        </h3>

                        <p>
                            Qty: ${product.quantity}
                        </p>

                    </div>

                    <strong>
                        ₹${(
                            product.price *
                            product.quantity
                        ).toLocaleString("en-IN")}
                    </strong>

                </div>

            `;

        });


        subtotalElement.textContent =
            "₹" + subtotal.toLocaleString("en-IN");


        totalElement.textContent =
            "₹" + subtotal.toLocaleString("en-IN");



        function placeOrder() {


            const name =
                document.getElementById("name").value;


            const email =
                document.getElementById("email").value;


            const phone =
                document.getElementById("phone").value;


            const address =
                document.getElementById("address").value;


            const city =
                document.getElementById("city").value;


            const pincode =
                document.getElementById("pincode").value;


            const state =
                document.getElementById("state").value;


            if (
                !name ||
                !email ||
                !phone ||
                !address ||
                !city ||
                !pincode ||
                !state
            ) {

                alert(
                    "Please complete all required fields."
                );

                return;

            }


            localStorage.removeItem("velorCart");


            window.location.href =
                "order-success.html";

        }

    </script>


</body>

</html>
