        name: "Fossil Neutra",
        category: "MINIMAL",
        price: 17000,
        image: "images/fossil/fossil-neutra.jpg"
    }
];


const params = new URLSearchParams(window.location.search);

const selectedBrand =
    (params.get("brand") || "").toLowerCase().trim();


const productsContainer =
    document.getElementById("products-container");


let displayedWatches = watches;


if (selectedBrand) {

    displayedWatches = watches.filter(function(watch) {

        return watch.brand === selectedBrand;

    });

}


function displayProducts(products) {

    productsContainer.innerHTML = "";

    products.forEach(function(watch) {

        const productCard =
            document.createElement("article");

        productCard.className = "shop-product";

        productCard.innerHTML = `

            <div class="shop-product-image">

                <img
                    src="${watch.image}"
                    alt="${watch.name}"
                >

            </div>

            <div class="shop-product-info">

                <div>

                    <p class="category">
                        ${watch.brand.toUpperCase()}
                    </p>

                    <h2>
                        ${watch.name}
                    </h2>

                </div>

                <p class="shop-price">
                    ₹${watch.price.toLocaleString("en-IN")}
                </p>

            </div>

            <a
                href="product.html?id=${watch.id}"
                class="view-product">

                VIEW PRODUCT →

            </a>
        `;

        productsContainer.appendChild(productCard);

    });


    document.getElementById("product-count").textContent =
        products.length + " TIMEPIECES";

}


displayProducts(displayedWatches);


document
    .getElementById("sort-products")
    .addEventListener("change", function() {

        let sorted = [...displayedWatches];

        if (this.value === "low") {

            sorted.sort(function(a, b) {
                return a.price - b.price;
            });

        }

        if (this.value === "high") {

            sorted.sort(function(a, b) {
                return b.price - a.price;
            });

        }

        displayProducts(sorted);

    });


function updateCartCount() {

    const cart =
        JSON.parse(localStorage.getItem("velorCart")) || [];

    const totalQuantity =
        cart.reduce(function(total, product) {

            return total + product.quantity;

        }, 0);

    document
        .querySelectorAll(".cart-count")
        .forEach(function(counter) {

            counter.textContent = totalQuantity;

        });

}


updateCartCount();
